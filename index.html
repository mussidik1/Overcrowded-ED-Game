:root {
  /* The charge nurse's magnet board: dry-erase white, marker ink, ESI-colored magnets.
     Layout: sticky radio + status strip on top, intake lanes, the bed board, providers docked at the bottom. */
  --board: #F1F3EF;
  --paper: #FFFFFF;
  --ink: #1B2230;
  --ink-2: #485263;
  --ink-3: #7A8493;
  --grid: rgba(27, 34, 48, .05);
  --frame: #1B2230;
  --accent: #1E5BC6;
  --good: #1F8048; --warn: #C97F06; --bad: #C8243A;
  --e1: #C8243A; --e2: #E9761A; --e3: #E3BA12; --e4: #2F9C55; --e5: #2B6FCB;
  --md: #22306C; --app: #0D716E; --rn: #66399A; --pct: #9C5418; --evs: #4F5F68; --rt: #1E7896; --rph: #7B4A73; --reg: #5E6C12; --tp: #A3417A;
  --display: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
  --ui: "Barlow Condensed", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", sans-serif-condensed, sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--board);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font: 500 15px/1.25 var(--ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
  overflow-x: clip;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; -webkit-user-select: none; user-select: none; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .45; }
[hidden] { display: none !important; }

.ghosts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.ghosts span { position: absolute; font: 400 28px/1 var(--display); color: rgba(27, 34, 48, .055); white-space: nowrap; }
.app { position: relative; z-index: 1; min-height: 100vh; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }

/* ---------- top: HUD, the Box, goals, selection ---------- */
.top { position: sticky; top: 0; z-index: 30; }
.hud { background: var(--frame); color: #F3F5F8; padding: calc(6px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); }
.hud-top { display: flex; align-items: center; gap: 8px; }
.brand { font: 400 19px/1 var(--display); letter-spacing: .4px; }
.brand small { display: block; font: 600 11px/1.2 var(--ui); letter-spacing: .8px; text-transform: uppercase; opacity: .6; margin-top: 2px; }
.clock { margin-left: auto; font: 700 27px/1 var(--ui); font-variant-numeric: tabular-nums; letter-spacing: .5px; }
.hud-btns { display: flex; gap: 6px; }
.hb { min-width: 40px; height: 36px; padding: 0 9px; border: 1.5px solid rgba(255, 255, 255, .28); border-radius: 9px; background: transparent; color: #fff; font-weight: 700; font-size: 14px; }
.hb.on { background: #F2C230; border-color: #F2C230; color: var(--ink); }
.hb.red { background: var(--bad); border-color: #FF9191; color: #fff; }
.pills { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding: 8px 0; }
.pill { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; padding: 5px 7px; border: 0; border-radius: 8px; background: rgba(255, 255, 255, .08); color: #fff; text-align: left; }
.pill b { font: 700 19px/1 var(--ui); font-variant-numeric: tabular-nums; }
.pill span { max-width: 100%; overflow: hidden; font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; text-overflow: ellipsis; white-space: nowrap; opacity: .7; }
.pill.good b { color: #86E3A8; } .pill.warn b { color: #F7C55A; } .pill.bad b { color: #FF9191; }
.shiftbar { height: 3px; margin: 0 calc(-1 * max(12px, env(safe-area-inset-right))) 0 calc(-1 * max(12px, env(safe-area-inset-left))); background: rgba(255, 255, 255, .12); }
.shiftbar i { display: block; width: 0; height: 100%; background: #F2C230; }

.boxbar { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 7px max(12px, env(safe-area-inset-right)) 7px max(12px, env(safe-area-inset-left)); background: #29303A; color: #E8ECF1; border-bottom: 2px solid #10151C; }
.bx-led { flex: none; width: 11px; height: 11px; border-radius: 50%; background: #3A4552; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .4); }
.bx-name { font: 400 15px/1.1 var(--display); letter-spacing: .3px; }
.bx-idle { font-size: 13px; opacity: .65; }
.bx-main { display: flex; flex: 1; flex-direction: column; gap: 3px; min-width: 0; }
.bx-txt { overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
.bx-bar { display: block; height: 4px; border-radius: 2px; background: rgba(0, 0, 0, .28); overflow: hidden; }
.bx-bar i { display: block; height: 100%; background: #FFE07A; }
.bx-hold { flex: none; padding: 3px 6px; border-radius: 6px; background: rgba(0, 0, 0, .25); font-size: 12px; font-weight: 700; }
.bx-btn { flex: none; height: 42px; padding: 0 14px; border: 0; border-radius: 10px; background: #fff; color: var(--ink); font-size: 15px; font-weight: 700; box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
.boxbar.notify { background: #9E1B2A; }
.boxbar.consult { background: #A85800; }
.boxbar.notify .bx-led, .boxbar.consult .bx-led { background: #FFE07A; box-shadow: 0 0 10px #FFE07A; animation: blink .6s steps(2) infinite; }
.boxbar.notify .bx-btn, .boxbar.consult .bx-btn { animation: nudge 1.1s ease-in-out infinite; }

.objs { display: flex; gap: 6px; overflow-x: auto; padding: 6px max(12px, env(safe-area-inset-left)); background: rgba(241, 243, 239, .96); border-bottom: 1px solid rgba(27, 34, 48, .12); scrollbar-width: none; }
.ob { flex: none; padding: 4px 8px; border-radius: 7px; background: #E8EBEF; font-size: 13px; white-space: nowrap; }
.ob b { font-weight: 700; }
.ob.goal { background: #DCE7FB; color: #173F86; }
.ob.bad { background: #FBE1E4; color: #8E1526; }
.ob.warn { background: #FCEFD2; color: #7A4B00; }
.ob.yellow { background: #F2C230; color: var(--ink); font-weight: 700; }
.ob.red { background: var(--bad); color: #fff; font-weight: 700; }

/* zone jump bar */
.zbar { display: flex; gap: 6px; overflow-x: auto; padding: 6px max(12px, env(safe-area-inset-right)) 7px max(12px, env(safe-area-inset-left)); background: rgba(241, 243, 239, .97); border-bottom: 1px solid rgba(27, 34, 48, .14); scrollbar-width: none; }
.zbar::-webkit-scrollbar { display: none; }
.zc { position: relative; flex: none; min-width: 38px; height: 32px; padding: 0 9px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--paper); font: 700 14px/1 var(--ui); white-space: nowrap; }
.zc.warn { border-color: #C99A0A; background: #FCEFD2; color: #7A4B00; }
.zc.zs-over { border-color: var(--bad); color: var(--bad); }
.zc.zs-none { border-color: var(--bad); background: var(--bad); color: #fff; }
.zc.zs-empty { border-color: #A3AAB3; color: var(--ink-3); }
.zc i { position: absolute; top: -6px; right: -6px; min-width: 18px; padding: 2px 4px; border-radius: 9px; background: var(--accent); color: #fff; font: 700 11px/1.1 var(--ui); font-style: normal; text-align: center; }
.zone, .intake { scroll-margin-top: calc(var(--topH, 170px) + 8px); }
.ob [data-cd] { font-weight: 700; font-variant-numeric: tabular-nums; }

.selbar { display: flex; align-items: center; gap: 8px; padding: 7px max(12px, env(safe-area-inset-left)); background: var(--accent); color: #fff; }
.selbar > span { flex: 1; min-width: 0; font-size: 14px; line-height: 1.2; }
.selbar button { flex: none; height: 34px; padding: 0 11px; border: 1.5px solid rgba(255, 255, 255, .6); border-radius: 8px; background: transparent; color: #fff; font-weight: 700; }
.selbar .esi { width: 20px; height: 20px; font-size: 12px; vertical-align: -4px; }

/* ---------- intake lanes ---------- */
.intake { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 10px 12px 2px; }
.lane, main { min-width: 0; }
.lane-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; margin-bottom: 5px; padding: 0; border: 0; background: none; text-align: left; }
.lane-t { font: 400 16px/1 var(--display); }
.lane-i { font: 600 12px/1.1 var(--ui); color: var(--ink-2); letter-spacing: .5px; text-transform: uppercase; text-align: right; }
.lane-i.bad { color: var(--bad); }
.lane-row { display: flex; gap: 8px; min-height: 60px; padding: 2px 2px 8px; overflow-x: auto; scrollbar-width: none; }
.lane-row::-webkit-scrollbar { display: none; }
.istaff { display: flex; align-items: center; gap: 6px; overflow-x: auto; margin: 0 -12px; padding: 2px 12px 6px; scrollbar-width: none; }
.istaff::-webkit-scrollbar { display: none; }
.ic-l { flex: none; color: var(--ink-3); font: 700 11px/1 var(--ui); letter-spacing: .6px; text-transform: uppercase; }
.ic { flex: none; display: grid; gap: 2px; min-width: 66px; min-height: 44px; padding: 5px 9px; border: 0; border-radius: 9px; color: #fff; text-align: left; box-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.ic * { pointer-events: none; }
.ic b { font: 700 14px/1 var(--ui); }
.ic small { font-size: 11.5px; line-height: 1.1; opacity: .9; }
.ic.reg { background: var(--reg); } .ic.tri { background: var(--rn); }
.ic.sel { outline: 3px solid #F2C230; outline-offset: 2px; transform: translateY(-2px); }
.ic.off { opacity: .5; }
.ist { display: inline-block; margin: 3px 3px 0 0; padding: 2px 4px 1px; border: 1.5px solid currentColor; border-radius: 4px; font: 700 9.5px/1 var(--ui); font-style: normal; letter-spacing: .3px; }
.ist.need { color: var(--bad); }
.ist.q { border-style: dashed; color: var(--ink-3); }
.ist.doing { background: #E6EEFC; color: var(--accent); }
.ist.done { border-color: var(--good); background: var(--good); color: #fff; }
.mag.ok { outline: 3px solid var(--good); outline-offset: 2px; }
.mag.no { opacity: .45; }
.mag.ready { box-shadow: inset 4px 0 0 var(--good), 0 1px 0 rgba(0, 0, 0, .05), 0 3px 9px rgba(27, 34, 48, .16); }
.lane-row:empty::before { content: attr(data-empty); align-self: center; padding: 0 4px; color: var(--ink-3); font-size: 14px; }

.mag { position: relative; flex: none; display: flex; align-items: center; gap: 6px; max-width: 210px; min-height: 54px; padding: 6px 10px 6px 7px; border: 0; border-radius: 13px; background: var(--paper); text-align: left; box-shadow: 0 1px 0 rgba(0, 0, 0, .05), 0 3px 9px rgba(27, 34, 48, .16); }
.mag * { pointer-events: none; }
.mag:nth-child(odd) { transform: rotate(-.6deg); }
.mag:nth-child(even) { transform: rotate(.5deg); }
.m-em { font-size: 22px; line-height: 1; }
.m-txt { min-width: 0; color: var(--ink-2); font-size: 13px; line-height: 1.15; }
.m-txt b { color: var(--ink); font-size: 14px; }
.m-t { align-self: flex-start; color: var(--ink-2); font: 700 13px/1 var(--ui); font-variant-numeric: tabular-nums; }
.mag.late .m-t { color: var(--bad); }
.mag.sel { outline: 3px solid var(--accent); outline-offset: 2px; transform: translateY(-2px) rotate(-1deg); }
.mag.ghost { background: transparent; box-shadow: none; outline: 2px dashed #9E1B2A; outline-offset: -2px; color: #9E1B2A; }
.mag.ghost .m-txt, .mag.ghost .m-txt b, .mag.ghost .m-t { color: #9E1B2A; }
.mag.tri { background: #FAFAF6; box-shadow: none; outline: 1.5px dashed var(--ink-3); outline-offset: -1.5px; }
.mag.crit { animation: critpulse 1s ease-in-out infinite; }

.esi { display: inline-grid; flex: none; place-items: center; width: 25px; height: 25px; border-radius: 50%; color: #fff; font: 700 14px/1 var(--ui); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18), 0 1px 2px rgba(0, 0, 0, .28); }
.esi.e1 { background: var(--e1); } .esi.e2 { background: var(--e2); } .esi.e3 { background: var(--e3); color: #3A2F00; } .esi.e4 { background: var(--e4); } .esi.e5 { background: var(--e5); }
.esi.eq { background: #9AA3AF; }

.atag, .vip, .stat, .crash, .rt, .stag, .rettag, .pitok { display: inline-block; padding: 2px 4px; border-radius: 4px; font: 700 9.5px/1 var(--ui); font-style: normal; letter-spacing: .4px; text-transform: uppercase; vertical-align: 1px; }
.atag { background: var(--e1); color: #fff; }
.atag.a-stroke { background: #66399A; } .atag.a-trauma { background: #A51D1D; } .atag.a-sepsis { background: #A85800; } .atag.a-peds, .atag.a-burn { background: var(--accent); } .atag.a-arrest { background: #111; }
.vip { background: #C9A227; color: var(--ink); }
.stat { background: var(--ink); color: #fff; }
.crash { background: var(--e1); color: #fff; }
.rt { border: 1px solid currentColor; color: var(--ink-3); }
.stag { background: #E8EBEF; color: var(--ink-2); }
.rettag { background: #5B2A86; color: #fff; }
.pitok { background: var(--good); color: #fff; }
.lg { display: inline-block; margin-left: 3px; padding: 1px 3px; border: 1.5px solid #A85800; border-radius: 4px; color: #A85800; font: 700 9.5px/1 var(--ui); font-style: normal; letter-spacing: .3px; vertical-align: 1px; }
.lg.req { border-color: var(--app); color: var(--app); border-style: dashed; }
.lg.on { border-color: var(--app); background: var(--app); color: #fff; }

/* ---------- the board ---------- */
.board { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 6px 12px 12px; }
.zone { display: grid; align-content: start; gap: 6px; }
.zh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 2px; border: 0; background: none; text-align: left; }
.zn { font: 400 18px/1 var(--display); }
.zr { color: var(--ink-2); font: 600 13px/1.1 var(--ui); text-align: right; }
.zr b { font-variant-numeric: tabular-nums; }
.zh.zs-ok .zr b { color: var(--good); } .zh.zs-full .zr b { color: var(--warn); } .zh.zs-over .zr b, .zh.zs-none .zr { color: var(--bad); }
.zh.zs-none .zr { animation: flash 1.1s ease-in-out infinite; }
.rooms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
.z-resus .rooms { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.room { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 3px; min-width: 0; min-height: 100px; padding: 6px 7px 7px; overflow: hidden; border: 2px solid var(--ink); border-radius: 7px 10px 8px 11px / 10px 7px 11px 8px; background: var(--paper); text-align: left; }
.room * { pointer-events: none; }
.rtop { display: flex; align-items: center; gap: 4px; min-width: 0; }
.rtop .esi { width: 21px; height: 21px; margin-left: auto; font-size: 12px; }
.rid { font: 400 17px/1 var(--display); }
.who { display: flex; align-items: center; gap: 3px; min-width: 0; font: 600 14px/1.1 var(--ui); white-space: nowrap; }
.pv { margin-left: auto; padding: 3px 4px; border-radius: 4px; color: #fff; font: 700 10px/1 var(--ui); font-style: normal; text-transform: uppercase; }
.pv.r-md { background: var(--md); } .pv.r-app { background: var(--app); }
.mag.pit { box-shadow: inset 4px 0 0 var(--app), 0 1px 0 rgba(0, 0, 0, .05), 0 3px 9px rgba(27, 34, 48, .16); }
.cc { display: -webkit-box; overflow: hidden; color: var(--ink-2); font-size: 13px; line-height: 1.15; overflow-wrap: anywhere; -webkit-hyphens: auto; hyphens: auto; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.cc.dx { color: var(--ink); font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 3px; }
.tg { padding: 2px 3px 1px; border: 1.5px solid currentColor; border-radius: 4px; color: var(--ink-3); font: 700 9.5px/1 var(--ui); font-style: normal; letter-spacing: .3px; }
.tg.pend { border-style: dotted; opacity: .65; }
.tg.todo { color: var(--ink-2); }
.tg.run { background: #E6EEFC; color: var(--accent); animation: runpulse 1.4s ease-in-out infinite; }
.tg.done { border-color: var(--good); background: var(--good); color: #fff; }
.tg.ver { border-color: #A85800; background: #FCEFD2; color: #8A4A00; }
.tg.lgx { border-color: #A85800; color: #A85800; }
.tg.lgr { border-color: var(--app); border-style: dashed; color: var(--app); }
.tg.lgo { border-color: var(--app); background: var(--app); color: #fff; }
.tg.need { border-color: var(--bad); background: var(--bad); color: #fff; animation: flash 1.1s ease-in-out infinite; }
.nx { margin-top: auto; font: 700 12.5px/1.15 var(--ui); letter-spacing: .1px; }
.n-act { color: var(--accent); } .n-go { color: var(--good); } .n-bad { color: var(--bad); } .n-wait { color: var(--ink-3); } .n-board { color: var(--rn); } .n-warn { color: #A85800; }
.n-code { align-self: flex-start; padding: 2px 5px; border-radius: 4px; background: var(--e1); color: #fff; }
.fl { animation: flash 1.1s ease-in-out infinite; }
.rs { margin-top: auto; font: 700 14px/1.1 var(--ui); }
.rh { color: var(--ink-2); font-size: 12px; }
.pb { display: block; height: 6px; margin-top: 4px; border-radius: 3px; background: rgba(58, 123, 184, .2); overflow: hidden; }
.pb i { display: block; width: 0; height: 100%; background: #3A7BB8; }

.room.st-occ { box-shadow: inset 6px 0 0 var(--esi-c, var(--ink)); padding-left: 11px; }
.room.e1 { --esi-c: var(--e1); } .room.e2 { --esi-c: var(--e2); } .room.e3 { --esi-c: var(--e3); } .room.e4 { --esi-c: var(--e4); } .room.e5 { --esi-c: var(--e5); }
.room.st-clean { border-color: var(--good); background: #F2FAF4; }
.room.st-clean .rs { color: var(--good); }
.room.st-dirty { border-style: dashed; border-color: #87653A; background: repeating-linear-gradient(135deg, #F4EDE2 0 7px, #EADFCC 7px 14px); }
.room.st-dirty .rs { color: #6E4E22; }
.room.st-cleaning { border-color: #3A7BB8; background: #EAF2FA; }
.room.st-closed { border-color: #A3AAB3; background: repeating-linear-gradient(135deg, #ECEEF0 0 6px, #E2E5E9 6px 12px); color: var(--ink-3); }
.room.crit { border-color: var(--e1); animation: critpulse 1s ease-in-out infinite; }
.room.ok { outline: 3px solid var(--good); outline-offset: 1px; animation: okpulse 1.2s ease-in-out infinite; }
.room.no { opacity: .38; }

.logwrap { padding: 4px 12px 14px; }
.logwrap h3 { margin: 4px 0 6px; font: 400 16px/1 var(--display); }
.log { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink-2); }
.log li { display: flex; gap: 8px; }
.log time { flex: none; color: var(--ink-3); font-weight: 700; font-variant-numeric: tabular-nums; }
.log .k-bad { color: var(--bad); } .log .k-good { color: var(--good); } .log .k-alert { color: #9E1B2A; font-weight: 700; } .log .k-mad { color: #A85800; }

/* ---------- dock (providers) ---------- */
.dock { position: fixed; right: 0; bottom: 0; left: 0; z-index: 25; display: flex; gap: 6px; padding: 8px max(10px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); border-top: 2px solid var(--ink); background: rgba(250, 251, 249, .97); }
.dock-prov { display: flex; flex: 1; gap: 6px; min-width: 0; overflow-x: auto; padding-top: 6px; scrollbar-width: none; }
.pm { position: relative; flex: 1 0 0; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 3px; min-width: 64px; min-height: 56px; padding: 6px 7px; border: 0; border-radius: 10px; color: #fff; text-align: left; box-shadow: 0 2px 0 rgba(0, 0, 0, .28); }
.pm * { pointer-events: none; }
.pm.r-md { background: var(--md); } .pm.r-app { background: var(--app); }
.pm-n { overflow: hidden; font: 700 15px/1 var(--ui); text-overflow: ellipsis; white-space: nowrap; }
.pm-t { overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; opacity: .88; }
.pm-q { position: absolute; top: -7px; right: -3px; padding: 3px 5px; border-radius: 9px; background: #F2C230; color: var(--ink); font: 700 11px/1 var(--ui); }
.pm.sel { outline: 3px solid #F2C230; outline-offset: 2px; transform: translateY(-3px); }
.pm.off { opacity: .45; }
.pm.onbox { box-shadow: 0 0 0 3px #E9761A; }
.pm.pit { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .13) 0 6px, transparent 6px 12px); }
.dock-team { flex: none; display: grid; place-items: center; width: 74px; margin-top: 6px; padding: 4px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); font-weight: 700; line-height: 1.1; text-align: center; }
.dock-team small { display: block; color: var(--ink-2); font-size: 11px; font-weight: 600; }

.side { display: none; }

/* ---------- sheets, modals, toasts ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 90; }
.sheet-bg { position: absolute; inset: 0; background: rgba(18, 24, 32, .38); }
.sheet { position: absolute; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; max-height: 84vh; overflow: hidden; border-radius: 18px 18px 0 0; background: var(--paper); font-family: var(--body); font-size: 15px; box-shadow: 0 -10px 30px rgba(0, 0, 0, .22); animation: up .18s ease-out; }
.sheet-body { overflow: auto; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
.sheet-x { position: absolute; top: 10px; right: 12px; z-index: 2; }
.sh-h, .ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; padding-right: 44px; }
.sh-h h3 { margin: 0; font: 400 21px/1.1 var(--display); text-wrap: balance; }
.sh-sub, .ph-sub { color: var(--ink-2); font-size: 13.5px; }
.x { flex: none; width: 38px; height: 38px; border: 0; border-radius: 50%; background: #EEF0F3; font-size: 16px; }
.ph-who { display: flex; align-items: center; gap: 10px; font-size: 16px; line-height: 1.3; }
.ph-em { font-size: 34px; line-height: 1; }
.ph-cc { display: grid; gap: 5px; margin: 10px 0; padding: 9px 11px; border-radius: 10px; background: #F4F6F8; line-height: 1.35; }
.ph-cc > div { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.ph-cc span { color: var(--ink-3); font: 700 11px/1.3 var(--ui); letter-spacing: .6px; text-transform: uppercase; }
.prim { display: grid; gap: 8px; margin: 10px 0 12px; }
.prim-l { color: var(--ink-2); font: 700 12px/1 var(--ui); letter-spacing: .6px; text-transform: uppercase; }
.big { width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font: 700 17px/1.1 var(--ui); }
.big.go { background: var(--good); } .big.act { background: var(--accent); } .big.warn { background: #F2C230; color: var(--ink); } .big.bad { background: var(--bad); }
.pgrid, .cgrid, .zgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pbtn, .cbtn, .zbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-height: 54px; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 11px; background: var(--paper); text-align: left; }
.pbtn b, .cbtn b, .zbtn b { font: 700 16px/1.1 var(--ui); }
.pbtn small, .cbtn small, .zbtn small { color: var(--ink-2); font-size: 12.5px; line-height: 1.2; }
.pbtn.r-md { border-color: var(--md); } .pbtn.r-app { border-color: var(--app); }
.pbtn.r-md b { color: var(--md); } .pbtn.r-app b { color: var(--app); }
.zbtn.on { border-color: var(--rn); background: #F3EDFA; }
.zbtn.on b { color: var(--rn); }
.zbtn.on b::after { content: " ✓"; }
.hint { margin: 4px 0 10px; color: var(--ink-2); font-size: 13.5px; line-height: 1.35; }
.why { margin: -2px 0 8px; color: var(--bad); font-size: 13px; }
.path { display: grid; gap: 0; margin: 4px 0 10px; padding: 0; list-style: none; border-top: 1px solid #E6E9EE; }
.pr { display: flex; gap: 10px; padding: 7px 2px; border-bottom: 1px solid #E6E9EE; font-size: 14px; line-height: 1.3; }
.pk { flex: none; width: 96px; color: var(--ink-3); font: 700 12px/1.6 var(--ui); letter-spacing: .5px; text-transform: uppercase; }
.pv2 { min-width: 0; }
.pr.ok .pk { color: var(--good); } .pr.ok .pk::before { content: "✓ "; }
.pr.need .pk, .pr.need .pv2 { color: var(--accent); font-weight: 700; }
.pr.idle .pv2 { color: var(--ink-3); }
.goals { display: grid; gap: 4px; margin: 8px 0; }
.goal { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 9px; background: #F4F6F8; font-size: 14px; }
.goal.ok { background: #E3F4E9; color: #145A33; } .goal.bad { background: #FBE1E4; color: #8E1526; }
.goal b { font-variant-numeric: tabular-nums; }
.sh-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.sh-acts button { min-height: 42px; padding: 0 13px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); font: 700 15px/1 var(--ui); }
.sh-acts button.warn { border-color: #C99A0A; background: #F2C230; }
.sh-acts button.hl { border-color: var(--accent); background: var(--accent); color: #fff; }
.dv { margin: 10px 0; padding: 11px 12px 12px; border: 2px solid var(--ink); border-radius: 12px; }
.dv b { font: 700 17px/1.15 var(--ui); }
.dv p { margin: 5px 0 10px; color: var(--ink-2); font-size: 14px; line-height: 1.35; }
.dv button { min-height: 42px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); font: 700 15px/1 var(--ui); }
.dv.yellow button { border-color: #C99A0A; background: #F2C230; }
.dv.red button { border-color: var(--bad); background: var(--bad); color: #fff; }
.dv.on button { border-color: var(--ink); background: var(--paper); color: var(--ink); }
.dv.yellow.on { border-color: #C99A0A; background: #FFF6D6; }
.dv.red.on { border-color: var(--bad); background: #FDECEE; }
.sheet h4 { margin: 14px 0 6px; color: var(--ink-3); font: 700 12px/1 var(--ui); letter-spacing: .7px; text-transform: uppercase; }
.slist { display: grid; gap: 6px; }
.srow { display: flex; align-items: center; gap: 10px; padding: 6px 2px; border-bottom: 1px solid #EEF0F3; }
.srow.break, .srow.away, .srow.pending { opacity: .62; }
.mg { display: grid; flex: none; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: #fff; font: 700 13px/1 var(--ui); text-transform: uppercase; box-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.mg.r-md { background: var(--md); } .mg.r-app { background: var(--app); } .mg.r-rn { background: var(--rn); } .mg.r-pct { background: var(--pct); } .mg.r-evs { background: var(--evs); } .mg.r-rt { background: var(--rt); } .mg.r-rph { background: var(--rph); } .mg.r-reg { background: var(--reg); } .mg.r-tp { background: var(--tp); }
.pbtn.r-reg { border-color: var(--reg); } .pbtn.r-reg b { color: var(--reg); } .pbtn.r-rn { border-color: var(--rn); } .pbtn.r-rn b { color: var(--rn); }
.pbtn.r-tp { border-color: var(--tp); } .pbtn.r-tp b { color: var(--tp); } .pbtn.r-pct { border-color: var(--pct); } .pbtn.r-pct b { color: var(--pct); }
.sinfo { display: grid; flex: 1; gap: 2px; min-width: 0; }
.sinfo b { font: 700 15px/1.1 var(--ui); }
.sinfo small { color: var(--ink-2); font-size: 12.5px; line-height: 1.25; }
.szones { color: var(--rn); font: 700 12px/1 var(--ui); }
.mor { display: block; height: 5px; border-radius: 3px; background: #E8EBEF; overflow: hidden; }
.mor i { display: block; height: 100%; }
.m-good { background: var(--good); } .m-warn { background: #E3A512; } .m-bad { background: var(--bad); }
.sb { flex: none; height: 34px; padding: 0 10px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--paper); font: 700 13px/1 var(--ui); }
.house { color: var(--ink-2); font-size: 13.5px; line-height: 1.5; }
.legend { display: flex; align-items: center; gap: 6px; margin: 2px 0 4px; color: var(--ink-2); font-size: 13px; }
.legend i { display: inline-block; width: 26px; height: 5px; border-radius: 3px; background: var(--good); }
.team-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.team-acts button { min-height: 40px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); font: 700 14px/1 var(--ui); }
.q { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.5; }
.help { padding-left: 20px; line-height: 1.45; }
.help li { margin-bottom: 8px; }
.help b { font-family: var(--ui); font-size: 16px; }

.modal-wrap { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 16px; background: rgba(18, 24, 32, .5); }
.modal { width: min(460px, 100%); max-height: 90vh; overflow: auto; padding: 18px 18px 16px; border-radius: 16px; background: var(--paper); font-family: var(--body); box-shadow: 0 16px 40px rgba(0, 0, 0, .3); animation: pop .16s ease-out; }
.modal h3 { margin: 2px 0 8px; font: 400 23px/1.1 var(--display); text-wrap: balance; }

/* ---------- getting admitted patients upstairs ---------- */

/* ---------- interfacility ambulances ---------- */

  const techs = G.staff.filter(s => s.role === 'pct' && s.st === 'on');
  let sitting = techs.filter(s => s.task && s.task.kind === 'sit').length;
  if (sitting && sitting === techs.length && pctItems(0).some(it => it.p && G.t - ((it.p.work[it.kind] && it.p.work[it.kind].tOrd) || it.p.tReady || G.t) > 10)) {
    const s = techs.filter(x => x.task && x.task.kind === 'sit').pop(), p = pt(s.task.pid);
    if (p) { p.sitBy = null; toast(`${s.name} had to leave the sitter post in ${roomName(p.room)}. Nobody else could do tech work.`, 'bad'); }
    s.task = null; free.push(s); sitting--;
  }
  const items = pctItems(Math.max(0, techs.length - 1 - sitting));
  for (const s of free) {
    const job = s.q.find(k => { const p = pt(k.pid); return p && p.dsp === 'xportq' && p.loc === 'room'; });
    if (job) { s.q.splice(s.q.indexOf(job), 1); departUp(pt(job.pid), s); continue; }
    if (s.q.length) s.q = [];
    const it = items.shift(); if (!it) continue;
    const p = it.p;
    if (it.kind === 'sit') { p.sitBy = s.id; s.task = { kind: 'sit', pid: p.id, left: 1e9, dur: 1e9, t0: G.t }; continue; }
    if (it.kind === 'errand') { G.errands.splice(G.errands.indexOf(it.e), 1); s.task = { kind: 'errand', label: it.e.label, left: it.dur, dur: it.dur, t0: G.t }; continue; }
    if (it.kind === 'ecg') p.work.ecg.st = 'doing';
    if (it.kind === 'lab') p.work.lab.st = 'doing';
    if (it.kind === 'morgue') p.dsp = 'morguing';
    if (it.kind === 'run') p.bb.st = 'run';
    s.task = { kind: it.kind, pid: p.id, left: it.dur, dur: it.dur, t0: G.t };
  }
}
function labTat(p) { let m = (p.alertOn || p.stat || p.esi <= 2) ? 10 : 16; if (G.mods.lab > G.t) m *= 2; return m; }
function labDrawn(p) {
  p.work.lab.st = 'run'; p.work.lab.due = G.t + labTat(p);
  if (p.bleed === 'prbc' && !p.bb) p.bb = { st: 'xm', due: G.t + (G.mods.bbSlow > G.t ? 60 : 30) };
}
function pctDone(k, p) {
  if (k.kind === 'ecg') { p.work.ecg.st = 'done'; p.work.ecg.tDone = G.t; goalHit(p, 'ecg10'); }
  else if (k.kind === 'lab') labDrawn(p);
  else if (k.kind === 'morgue') leave(p, 'expired');
  else if (k.kind === 'run') { if (p.bb) { p.bb.st = 'here'; note(`MTP cooler is at the bedside in ${label(p)}`); } }
}

/* ---------- respiratory therapy ---------- */
function rtTick(dt) {
  for (const s of G.staff) {
    if (s.role !== 'rt' || s.st !== 'on') continue;
    if (s.task) {
      const p = pt(s.task.pid);
      if (!p || p.loc === 'gone') { s.task = null; continue; }
      s.task.left -= dt * rnSpeed(s);
      if (s.task.left <= 0) { const k = s.task; s.task = null; s.done++; if (k.kind === 'rt') treatDone(p, k.key); }
      continue;
    }
    let best = null;
    for (const p of inRooms()) {
      for (const k in p.treat) {
        const it = p.treat[k];
        if (it.st !== 'todo' || TREAT[k].by !== 'rt') continue;
        const pr = (p.alertOn ? 0 : 10) + p.esi * 10 + (p.stat ? -15 : 0) + (k === 'vent' ? -5 : 0);
        if (!best || pr < best.pr) best = { p, k, pr };
      }
    }
    if (best) { best.p.treat[best.k].st = 'doing'; s.task = { kind: 'rt', pid: best.p.id, key: best.k, left: TREAT[best.k].dur, dur: TREAT[best.k].dur, t0: G.t }; }
  }
}

/* ---------- pharmacy ---------- */
function verifyItems() {
  const out = [];
  for (const p of active()) for (const k in p.treat) {
    const it = p.treat[k];
    if (it.st === 'verify' && !it.vby) out.push({ p, k, pr: (k === 'tnk' ? -20 : 0) + (p.alertOn ? 0 : 10) + p.esi * 10 + (p.stat ? -15 : 0) });
  }
  out.sort((a, b) => a.pr - b.pr || a.p.tArrive - b.p.tArrive);
  return out;
}
function verifyDur(k) { return (k === 'tnk' ? 4 : 2) * (G.mods.shortage > G.t ? 2 : 1); }
function verified(p, k) { const it = p.treat[k]; if (it && it.st === 'verify') { it.st = 'todo'; it.tOrd = G.t; } if (it) it.vby = null; }
function rphTick(dt) {
  let anyOn = false;
  for (const s of G.staff) {
    if (s.role !== 'rph' || s.st !== 'on') continue;
    anyOn = true;
    if (s.task) {
      const p = pt(s.task.pid);
      if (!p || p.loc === 'gone') { s.task = null; continue; }
      s.task.left -= dt;
      if (s.task.left <= 0) { const k = s.task; s.task = null; s.done++; verified(p, k.key); }
      continue;
    }
    const v = verifyItems()[0];
    if (v) { v.p.treat[v.k].vby = s.id; const d = verifyDur(v.k); s.task = { kind: 'verify', pid: v.p.id, key: v.k, left: d, dur: d, t0: G.t }; }
  }
  if (!anyOn && G.mods.remoteRph) {
    if (G.remote) {
      const p = pt(G.remote.pid);
      G.remote.left -= dt;
      if (!p || p.loc === 'gone') G.remote = null;
      else if (G.remote.left <= 0) { verified(p, G.remote.key); G.remote = null; }
    } else {
      const v = verifyItems()[0];
      if (v) { v.p.treat[v.k].vby = 'remote'; G.remote = { pid: v.p.id, key: v.k, left: verifyDur(v.k) * 2 }; }
    }
  }
}
function overrideRx(pid) {
  const p = pt(pid); if (!p) return { ok: false, why: 'No patient' };
  const items = Object.keys(p.treat).filter(k => p.treat[k].st === 'verify');
  if (!items.length) return { ok: false, why: 'Nothing is waiting on pharmacy for this patient' };
  let errors = 0;
  for (const k of items) {
    for (const s of G.staff) if (s.task && s.task.kind === 'verify' && s.task.pid === p.id && s.task.key === k) s.task = null;
    if (G.remote && G.remote.pid === p.id && G.remote.key === k) G.remote = null;
    verified(p, k);
    G.stats.overrides++;
    if (chance(0.07)) errors++;
  }
  if (errors) {
    G.stats.medErrors += errors; G.stats.adverse += errors; care(-30 * errors, 'safety');
    toast(`Medication error in ${label(p)}: an overridden dose was wrong for her kidney function. Pharmacy would have caught it.`.replace('her', p.sex === 'M' ? 'his' : 'her'), 'bad'); sound('bad');
    return { ok: true, msg: 'Pulled on override. One dose went wrong.' };
  }
  return { ok: true, msg: `Pulled ${items.length} med${items.length > 1 ? 's' : ''} on override for ${label(p)}. Faster, without a pharmacist's check.` };
}

/* ---------- blood bank ---------- */
function activateMTP(pid) {
  const p = pt(pid); if (!p) return { ok: false, why: 'No patient' };
  if (p.bb && (p.bb.mtp || p.bb.st === 'here')) return { ok: false, why: 'Massive transfusion is already running for this patient' };
  G.stats.mtp++;
  const uses = Math.min(4, G.blood.oneg);
  G.blood.oneg -= uses; G.stats.oneg += uses;
  if (p.bleed !== 'mtp') {
    G.stats.mtpWaste++; care(-10, 'blood');
    note(`MTP cancelled for ${label(p)}: not a hemorrhage. ${uses} units of O-negative wasted.`, 'bad');
    return { ok: false, why: 'The blood bank pushed back: this patient is not bleeding out. Cooler cancelled, O-negative wasted.' };
  }
  p.bb = { st: 'mtp', due: G.t + (uses >= 4 ? 8 : 15), mtp: true };
  if (G.blood.oneg <= 4) toast(`Blood bank: only ${G.blood.oneg} units of O-negative left`, 'bad');
  return { ok: true, msg: `MTP activated for ${label(p)}. The first cooler is ready in about ${uses >= 4 ? 8 : 15} min, and a tech will run it.` };
}
function releaseONeg(pid) {
  const p = pt(pid); if (!p) return { ok: false, why: 'No patient' };
  if (p.bleed !== 'prbc') return { ok: false, why: p.bleed === 'mtp' ? 'This patient needs the massive transfusion protocol' : 'This patient does not need blood' };
  if (p.bb && (p.bb.st === 'ready' || p.bb.st === 'erel')) return { ok: false, why: 'Blood is already ready or on the way' };
  if (G.blood.oneg < 2) return { ok: false, why: 'The blood bank is out of O-negative. Wait for the crossmatch.' };
  G.blood.oneg -= 2; G.stats.oneg += 2;
  p.bb = { st: 'erel', due: G.t + 5 };
  return { ok: true, msg: `2 units of O-negative on the way for ${label(p)} (about 5 min). ${G.blood.oneg} left in the blood bank.` };
}
function bloodTick() {
  for (const p of active()) {
    const b = p.bb; if (!b) continue;
    if ((b.st === 'xm' || b.st === 'erel') && G.t >= b.due) { b.st = 'ready'; note(`Blood is ready for ${label(p)}`); }
    else if (b.st === 'mtp' && G.t >= b.due) { b.st = 'cooler'; b.coolerAt = G.t; }
    else if (b.st === 'cooler' && G.t - b.coolerAt > 8) { b.st = 'here'; note(`The blood bank ran the MTP cooler to ${label(p)} themselves`); }
  }
}

/* ---------- interpreters ---------- */
function requestInterp(pid) {
  const p = pt(pid); if (!p) return { ok: false, why: 'No patient' };
  if (!p.lang) return { ok: false, why: 'This patient speaks English' };
  if (p.interp !== 'none') return { ok: false, why: p.interp === 'on' ? 'The interpreter is already connected' : 'The interpreter is already on the way' };
  const slow = G.mods.interpDown > G.t ? 15 : 0;
  const mins = (p.lang === 'asl' ? randi(15, 25) : randi(2, 6)) + slow;
  p.interp = 'req'; p.interpDue = G.t + mins; G.stats.interp++;
  return { ok: true, msg: `${p.lang === 'asl' ? 'ASL interpreter' : LANGS[p.lang] + ' video interpreter'} for ${label(p)} in about ${mins} min` };
}
function interpTick() {
  for (const p of active()) if (p.interp === 'req' && G.t >= p.interpDue) { p.interp = 'on'; note(`${LANGS[p.lang]} interpreter connected for ${label(p)}`); }
}

/* ---------- imaging, results, consults ---------- */
function imgTick(dt) {
  for (const m of ['xr', 'ct', 'us']) {
    const S = G.img[m];
    if (S.down > G.t) continue;
    if (S.busy) {
      S.busy.left -= dt * (G.mods.ehr > G.t ? 1 / 1.3 : 1);
      if (S.busy.left <= 0) {
        const p = pt(S.busy.pid); S.busy = null;
        if (p && p.work[m] && p.work[m].st === 'doing') {
          p.work[m].st = 'run'; p.work[m].due = G.t + WORK[m].read * (p.alertOn || p.stat ? 0.5 : 1);
          if (m === 'ct') goalHit(p, 'ct25');
        }
      }
      continue;
    }
    S.q = S.q.filter(id => { const p = pt(id); return p && p.loc !== 'gone' && p.work[m] && p.work[m].st === 'todo'; });
    let bestId = null, bestPr = 1e9;
    for (const id of S.q) {
      const p = pt(id);
      if (!(p.loc === 'room' || (p.loc === 'waiting' && p.pitSeen))) continue;
      const pr = (p.alertOn ? 0 : 20) + (p.stat ? -10 : 0) + p.esi * 4 + p.tArrive / 1000;
      if (pr < bestPr) { bestPr = pr; bestId = id; }
    }
    if (!bestId) continue;
    S.q.splice(S.q.indexOf(bestId), 1);
    pt(bestId).work[m].st = 'doing';
    S.busy = { pid: bestId, left: WORK[m].scan, dur: WORK[m].scan, t0: G.t };
  }
}
function resultTick() {
  for (const p of active()) {
    for (const k in p.work) {
      const w = p.work[k];
      if (w.st === 'run' && G.t >= w.due) { w.st = 'done'; w.tDone = G.t; if (p.alertOn && p.find[k]) note(`${label(p)} ${WORK[k].label}: ${p.find[k]}`); }
    }
  }
}
function consultTick() {
  for (const p of active()) {
    const c = p.consult;
    if (c.st === 'req' && G.t >= c.due) {
      c.st = 'here'; c.tArr = G.t;
      const S = SPECS[c.spec];
      if (p.loc === 'room') note(`${S.doc} (${S.name}) is at the bedside in ${roomName(p.room)}`);
      else toast(`${S.doc} (${S.name}) is here, but ${p.name} still has no room`, 'bad');
    }
  }
}
function consult(pid, spec) {
  const p = pt(pid), S = SPECS[spec];
  if (!p || !S) return { ok: false, why: 'Pick a patient and a service' };
  if (!p.alertOn) {
    if (p.loc !== 'room') return { ok: false, why: 'Put the patient in a room first' };
    if (p.ev !== 'done') return { ok: false, why: 'A provider has to see the patient before you consult' };
  }
  if (p.consult.st !== 'none') return { ok: false, why: `${SPECS[p.consult.spec].name} is already involved` };
  const m = G.spec[spec];
  if (p.con !== spec) {
    m.mood = Math.max(-3, m.mood - 1); m.at = G.t; care(-10, 'consult'); G.stats.wrongSpec++; provHit(p, 3); sound('bad');
    return { ok: false, mad: true, why: `${S.doc} (${S.name}): "${p.con ? `Why is ${S.name.toLowerCase()} getting this call? Not ours.` : 'This patient does not need a consult. Send them home.'}"` };
  }
  // EMS-activated STEMI, stroke, and trauma alerts can call their team on the field report alone
  const miss = (p.alertOn && ALERTS[p.alert] && ALERTS[p.alert].auto) ? [] : p.pre.filter(k => !(p.work[k] && p.work[k].st === 'done'));
  if (miss.length) {
    m.mood = Math.max(-3, m.mood - 1); m.at = G.t; care(-15, 'consult'); G.stats.angry++; provHit(p, 4); sound('bad');
    return { ok: false, mad: true, why: `${S.doc} (${S.name}): "${S.mad(miss.map(k => MISS_NAME[k]).join(' and '))}"` };
  }
  const base = spec === 'trauma' ? randi(8, 14) : randi(12, 22), mult = [1, 1.2, 1.5, 1.9][-m.mood] || 1;
  const mins = Math.round(base * mult);
  p.consult = { st: 'req', spec, due: G.t + mins, t0: G.t };
  return { ok: true, msg: `${S.doc} (${S.name}) will see ${label(p)} in about ${mins} min` };
}
function provHit(p, n) { const s = staff(p.prov); if (s) s.morale -= n; }

/* ---------- goals ---------- */
function goalHit(p, key, when) {
  if (!(key in p.goals) || p.goals[key] !== null) return;
  const el = (when == null ? G.t : when) - p.tArrive;
  const ok = el <= GOALS[key].lim + 1e-9;
  p.goals[key] = ok;
  if (G.pre) return;
  G.stats.goals.list.push({ key, ok, el: Math.round(el), alert: p.alert });
  if (ok) { G.stats.goals.met++; care(30, 'goals'); toast(`${GOALS[key].label}: ${Math.round(el)} min. Goal met · ${label(p)}`, 'good'); sound('good'); }
  else { G.stats.goals.miss++; care(-20, 'goals'); }
}
function goalMissTick(p) {
  for (const key in p.goals) {
    if (p.goals[key] === null && G.t - p.tArrive > GOALS[key].lim) {
      p.goals[key] = false;
      if (G.pre) continue;
      G.stats.goals.miss++; care(-20, 'goals'); G.stats.goals.list.push({ key, ok: false, el: null, alert: p.alert });
      toast(`Missed: ${GOALS[key].label} under ${GOALS[key].lim} min · ${label(p)}`, 'bad');
    }
  }
}

/* ---------- flow, dispositions ---------- */
const allWorkDone = p => p.wk.every(k => p.work[k] && p.work[k].st === 'done');
const preDone = p => p.pre.every(k => p.work[k] && p.work[k].st === 'done');
const treatsDone = p => p.tr.every(k => p.treat[k] && p.treat[k].st === 'done');
function flowTick() {
  for (const p of active()) {
    if ('surg15' in p.goals && p.goals.surg15 === null && p.consult.st === 'here' && p.loc === 'room') goalHit(p, 'surg15', Math.max(p.consult.tArr, p.tRoom));
    goalMissTick(p);
    if (p.loc !== 'room') continue;
    if (p.ev === 'done' && !p.dxK && p.re === 'none' && allWorkDone(p)) {
      const s = staff(p.prov);
      if (s && isProv(s) && present(s) && !s.pit) { p.re = 'q'; addTask(s, { type: 'reassess', pid: p.id, dur: 3 * langMul(p), label: 'Recheck' }); }
      else { p.re = 'need'; p.prov = null; p.tNeed = G.t; }
    }
    if (p.treat.tnk && p.treat.tnk.st === 'wait' && p.consult.st === 'here' && p.work.ct && p.work.ct.st === 'done') openGate(p.treat.tnk, 'tnk');
    if (p.treat.blood && p.treat.blood.st === 'wait' && p.bb && p.bb.st === 'ready') openGate(p.treat.blood, 'blood');
    if (p.treat.mtp && p.treat.mtp.st === 'wait' && p.bb && p.bb.st === 'here') openGate(p.treat.mtp, 'mtp');
    if (p.dsp === 'none') checkDispo(p); else dspTimers(p);
  }
}
function checkDispo(p) {
  if (p.ev !== 'done' || !p.dxK || p.arrest || p.reg !== 'done') return;
  if (p.need && !p.need.every(k => p.work[k] && p.work[k].st === 'done')) return;
  if (p.con && p.consult.st !== 'here') return;
  if (!treatsDone(p)) return;
  const L = LEVELS[G.level];
  if (p.dispo === 'home') p.dsp = 'ready';
  else if (p.dispo === 'transfer') p.dsp = 'readytx';
  else if (p.dispo === 'admit' || p.dispo === 'icu' || p.dispo === 'bh') {
    const base = p.dispo === 'icu' ? randi(30, 90) : p.dispo === 'bh' ? randi(100, 200) : randi(45, 110);
    p.dsp = 'board'; p.due = G.t + base * L.board; p.tBoard = G.t;
    note(`${label(p)} admitted. Waiting on an inpatient bed.`);
  } else if (p.dispo === 'or' || p.dispo === 'cath') { p.dsp = 'toproc'; p.due = G.t + 4; }
}
function dspTimers(p) {
  if (p.dsp === 'board' && G.t >= p.due) { p.dsp = 'bedready'; p.tReady = G.t; note(`Bed assigned upstairs for ${label(p)}. Needs transport.`); }
  else if (p.dsp === 'toproc' && G.t >= p.due) leave(p, p.dispo);
  else if (p.dsp === 'txcall' && G.t >= p.due) { p.dsp = 'txok'; note(`${cap(p.txTo)} accepted ${label(p)}. Book an interfacility ambulance.`); }
  else if (p.dsp === 'iftwait' && p.airAbort && G.t >= p.due - 8) { p.dsp = 'txok'; p.airAbort = false; G.stats.airAbort++; toast(`The helicopter for ${label(p)} turned back for weather. Book ground transport.`, 'bad'); }
  else if (p.dsp === 'iftwait' && G.t >= p.due) {
    if (p.needCC && p.iftLevel === 'als') { p.dsp = 'txok'; care(-10, 'transfer'); G.stats.iftRefused++; toast(`The ALS crew can't take ${label(p)}: this patient needs critical care transport. Book again.`, 'bad'); }
    else { p.dsp = 'iftreport'; p.due = G.t + 5; note(`${IFT[p.iftLevel].name} crew is at the bedside in ${label(p)}, taking report`); }
  }
  else if (p.dsp === 'iftreport' && G.t >= p.due) leave(p, 'tx');
  else if (p.dsp === 'family' && G.t >= p.due) { p.dsp = 'morgue'; p.tReady = G.t; }
  else if (p.dsp === 'morgue' && G.t - (p.tReady || G.t) > 20) leave(p, 'expired');
}
function discharge(pid) {
  const p = pt(pid); if (!p) return { ok: false, why: 'No patient' };
  if (p.dsp !== 'ready') return { ok: false, why: p.dispo === 'home' ? 'Not ready yet. Workup or treatment is still pending.' : 'This patient is not going home' };
  p.dsp = 'dc';
  return { ok: true, msg: `Discharge started for ${label(p)}. The nurse will do the teaching.` };
}
function requestTransfer(pid) {
  const p = pt(pid); if (!p) return { ok: false, why: 'No patient' };
  if (p.dsp !== 'readytx') return { ok: false, why: 'Not ready for transfer yet' };
  p.dsp = 'txcall'; p.due = G.t + randi(8, 15); goalHit(p, 'tx45');
  return { ok: true, msg: `Transfer center is calling ${p.txTo} for ${label(p)}` };
}
function escalate(pid) {
  const p = pt(pid);
  if (!p || p.dsp !== 'board') return { ok: false, why: 'Only admitted patients waiting for a bed can be escalated' };
  if (G.house.esc <= 0) return { ok: false, why: 'The House Supervisor is out of favors for this shift' };
  G.house.esc--; p.due = G.t + (p.due - G.t) * 0.45;
  return { ok: true, msg: `House Sup is pushing a bed for ${label(p)} (${G.house.esc} favors left)` };
}
function toggleStat(pid) {
  const p = pt(pid); if (!p) return { ok: false, why: 'No patient' };
  p.stat = !p.stat;
  for (const s of G.staff) if (isProv(s)) sortQ(s);
  return { ok: true, msg: p.stat ? `${label(p)} marked STAT. Everyone works it first.` : `STAT cleared for ${label(p)}` };
}
function leave(p, outcome) {
  const r = roomOf(p);
  if (r) { r.pid = null; r.st = 'dirty'; r.dirt = (p.iso || outcome === 'expired') ? 'term' : 'std'; }
  if (p.loc === 'triage') { const i = G.triageQ.indexOf(p.id); if (i >= 0) G.triageQ.splice(i, 1); }
  if (p.sitBy) releaseSitter(p);
  for (const s of G.staff) {
    if (s.q.length) s.q = s.q.filter(k => k.pid !== p.id);
    if (s.tq.length) s.tq = s.tq.filter(k => k.pid !== p.id);
    if (s.task && s.task.pid === p.id) s.task = null;
  }
  if (G.remote && G.remote.pid === p.id) G.remote = null;
  const wasLoc = p.loc;
  p.loc = 'gone'; p.tDone = G.t; p.outcome = outcome; p.room = null;
  if (outcome === 'cath') goalHit(p, 'cath60');
  if (G.pre) return;
  const S = G.stats;
  if (outcome === 'dc') { S.dc++; care(10, 'flow'); if (p.tDone - p.tArrive <= 120) { care(5, 'flow'); S.quick++; } }
  else if (outcome === 'admit' || outcome === 'icu' || outcome === 'bh') { S[outcome]++; care(12, 'flow'); }
  else if (outcome === 'or') { S.or++; care(15, 'flow'); toast(`${p.name} is off to the OR`, 'good'); }

/* ---------- 72-hour returns ---------- */

/* ---------- waiting room, ratios, morale, AMA (once per game minute) ---------- */

function zoneLoad(z) { let L = 0; for (const r of G.rooms) if (r.z === z && r.pid) L += weight(G.pts[r.pid]); return L; }

function hemorrhageTick(p) {

/* ---------- staff status: breaks, absences, arrivals ---------- */
function startCover(s) {

  card: k => { E.chooseCard(k); },
  assign: sid => { const s = U.sheet, r = E.assign(sid, s && s.pid); toast(r.ok ? r.msg : r.why, r.ok ? 'good' : 'bad'); if (r.ok) U.sheet = null; },
  consultOpen: pid => { U.sheet = { type: 'consult', pid }; },
  consultSpec: spec => { const pid = U.sheet && U.sheet.pid, r = E.consult(pid, spec); toast(r.ok ? r.msg : r.why, r.ok ? 'good' : r.mad ? 'mad' : 'bad'); U.sheet = r.ok ? null : { type: 'pt', pid }; },
  dc: pid => res(E.discharge(pid), true),
  tx: pid => res(E.requestTransfer(pid), true),
  esc: pid => res(E.escalate(pid)),
  stat: pid => res(E.toggleStat(pid)),
  mtp: pid => { const r = E.activateMTP(pid); toast(r.ok ? r.msg : r.why, r.ok ? 'good' : 'bad'); if (r.ok) sfx('good'); },
  oneg: pid => res(E.releaseONeg(pid)),
  interp: pid => res(E.requestInterp(pid)),
  override: pid => res(E.overrideRx(pid)),
  pit: a => { const [sid, on] = a.split('|'); res(E.setPit(sid, on === '1')); },
  moveSel: pid => { U.sel = { type: 'move', pid }; U.sheet = null; },
  placeSel: pid => { U.sel = { type: 'pt', pid }; U.sheet = null; },
  provOpen: pid => { U.sheet = { type: 'prov', pid }; },
  brk: sid => res(E.sendBreak(sid)),
  zt: a => { const [sid, z] = a.split('|'); res(E.toggleZone(sid, z)); },
  zclose: z => res(E.setZoneClosed(z, true)),
  zopen: z => res(E.setZoneClosed(z, false)),
  agency: z => res(E.callAgency(z)),
  pizza: () => res(E.orderPizza()),
  yellow: () => { U.sheet = { type: 'divert' }; },
  divertSet: a => { const [k, on] = a.split('|'); res(E.setDivert(k, on === '1')); },
  pause: () => { U.paused = !U.paused; if (U.paused) save(true); },
  resume: () => { U.paused = false; },
  speed: () => { U.speed = SPEEDS[(SPEEDS.indexOf(U.speed) + 1) % SPEEDS.length]; toast(`${U.speed}× speed`, 'info'); },
  sound: () => { U.sound = !U.sound; store('oc-sound', U.sound ? '1' : '0'); if (U.sound) ensureAudio(); if (U.scene === 'title') setH($('#title'), titleHTML()); },
  help: () => { U.sheet = { type: 'help' }; },
  pack: k => { U.pack = k; store('oc-pack', k); setH($('#title'), titleHTML()); },
  start: lvl => start(lvl),
  resumeSave: () => resumeSave(),
  restart: () => start(U.lvl),
  menu: () => { save(true); showTitle(); },
  pill: k => toast(PILL_HELP[k], 'info'),
};
const PILL_HELP = {
  wait: 'Average wait: door to provider, for everyone who arrived this shift (still-waiting patients count too). A provider in triage brings it down.',
  care: 'Patient management score: earned by moving patients, hitting alert times, and good Box calls. Lost to LWBS, AMA, 72-hour returns, wall time, unsafe ratios, and angry consultants.',
  staff: 'Staff satisfaction: average morale. Breaks and backup help. Over-ratio pods, mandates, and missed breaks hurt. Below 20% the staff walk out.',
  lwbs: 'Left without being seen. Each one costs points, and some come back sicker.',
  wall: 'Ambulances waiting on your wall. Offload within 30 minutes or the EMS system will call.',
};

/* ---------- save and resume (this device only) ---------- */
function save(force) {
  const G = g();
  if (U.scene !== 'game' || !G || G.over) return;
  const now = Date.now();
  if (!force && now - U.lastSave < 15000) return;
  U.lastSave = now;
  try { localStorage.setItem('oc-save', JSON.stringify({ G, lvl: U.lvl, pack: G.pack, at: now })); } catch (e) { /* storage full or blocked */ }
}
function readSave() { try { const s = localStorage.getItem('oc-save'); if (!s) return null; const d = JSON.parse(s); return d && d.G && d.G.v === 3 && !d.G.over ? d : null; } catch (e) { return null; } }
function resumeSave() {
  const d = readSave(); if (!d) { toast('No saved shift on this device', 'bad'); return; }
  E.load(d.G); U.lvl = d.lvl; U.scene = 'game'; U.sel = null; U.sheet = null; U.modal = null; U.paused = true; U.speed = 1;
  $('#title').hidden = true; $('#report').hidden = true;
  render();
}

/* ---------- scenes ---------- */
const DOT = { easy: 'var(--e4)', med: 'var(--e3)', hard: 'var(--e1)' };
function bestOf(l) { return +(store('oc-best-' + l) || 0); }
function titleHTML() {
  const lv = ['easy', 'med', 'hard'].map(k => { const L = E.LEVELS[k], b = bestOf(k), st = b ? E.starsFor(b, k) : 0; return `<button type="button" class="lvl" data-act="start" data-arg="${k}"><span class="dot" style="background:${DOT[k]}"></span><span><b>${L.name}</b><small>${L.blurb}</small></span>${b ? `<span class="best">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</span>` : ''}</button>`; }).join('');
  const sv = readSave();
  const resume = sv ? `<button type="button" class="lvl resume" data-act="resumeSave"><span class="dot" style="background:var(--accent)"></span><span><b>Resume your shift</b><small>${esc(E.LEVELS[sv.lvl] ? E.LEVELS[sv.lvl].name : '')}, paused at ${E.clock(sv.G.t)}</small></span></button>` : '';
  const packs = Object.entries(E.PACKS).map(([k, P]) => `<button type="button" class="seg${U.pack === k ? ' on' : ''}" data-act="pack" data-arg="${k}" aria-pressed="${U.pack === k}">${esc(P.name)}</button>`).join('');
  return `<div class="card"><div class="t-kicker">An ED shift survival game</div><h1 class="t-brand">Overcrowded</h1><svg class="t-under" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M3 8 C 60 3, 120 10, 180 5 S 270 4, 297 7" stroke="#C8243A" stroke-width="4" fill="none" stroke-linecap="round"/></svg><p class="t-sub">You're the charge nurse for a 32-bed ED, 07:00 to 19:00. Five pods, a resus team, a radio that won't stop ringing, and an administrator who just walked in.</p><div class="levels">${resume}${lv}</div><div class="packs"><span>Box consults</span><div class="segs">${packs}</div><small>${esc(E.PACKS[U.pack].note)}</small></div><div class="t-links"><button type="button" data-act="help">How to play</button><button type="button" data-act="sound">Sound: ${U.sound ? 'on' : 'off'}</button></div></div>`;
}
function clearToasts() { const b = $('#toasts'); if (b) b.innerHTML = ''; }
function showTitle() {
  clearToasts();
  U.scene = 'title'; U.sel = null; U.sheet = null; U.modal = null; U.paused = false;
  E.newGame('med', 4242);
  for (let i = 0; i < 160; i++) { E.step(0.25); E.botStep({}); }
  $('#report').hidden = true;
  const t = $('#title'); t.hidden = false; setH(t, titleHTML());
  render();
}
function start(lvl) {
  ensureAudio();
  U.lvl = lvl; U.scene = 'game'; U.sel = null; U.sheet = null; U.modal = null; U.paused = false; U.speed = 1;
  store('oc-save', null);
  E.newGame(lvl, (Math.random() * 2147483647) | 0, { pack: U.pack });
  $('#title').hidden = true; $('#report').hidden = true;
  if (!store('oc-seen-help2')) { store('oc-seen-help2', '1'); U.paused = true; U.sheet = { type: 'help' }; }
  render();
  toast(`${E.LEVELS[lvl].name}. Night shift hands you the board.`, 'info');
}
const VERDICT = ['Rough one. Everybody survived the shift, mostly.', 'You kept the doors open. Tomorrow will be better.', 'Solid shift. The night charge owes you.', 'Charge nurse of the year. Somebody frame this board.'];
function reportHTML(R) {
  const L = E.LEVELS[R.level], led = g().ledger;
  const LED = { flow: 'Patients moved', goals: 'Alert time goals', box: 'The Box', consult: 'Consults', lwbs: 'Left without being seen', ama: 'Left against advice', returns: '72-hour returns', wall: 'Wall time', ratio: 'Over-ratio nursing', uncovered: 'Uncovered patients', safety: 'Safety events', hall: 'Hallway beds', sitter: 'Missing sitters', waiting: 'Waiting-room crashes', admin: 'Administration', staffing: 'Staffing costs', divert: 'Divert', blood: 'Bleeding and blood' };
  const rows = Object.entries(led).filter(([, v]) => Math.abs(v) >= 1).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${LED[k] || k}</td><td class="${v < 0 ? 'neg' : 'pos'}">${v > 0 ? '+' : ''}${Math.round(v)}</td></tr>`).join('');
  const t = (a, b) => `<tr><td>${a}</td><td>${b}</td></tr>`;
  return `<div class="card rep"><h2>${R.fail ? 'The staff walked out' : 'Shift report'}</h2><div class="stars" aria-label="${R.stars} of 3 stars">${'★'.repeat(R.stars)}${'☆'.repeat(3 - R.stars)}</div><p class="verdict">${R.fail ? 'Staff satisfaction hit the floor and your nurses went home. Breaks, backup, and fewer mandates keep people around.' : VERDICT[R.stars]} ${esc(L.name)}, ${esc(E.PACKS[R.pack].name.toLowerCase())} Box consults.</p>
<div class="rep-big"><div><b>${R.care}</b><span>Pt mgmt</span></div><div><b>${R.wait}m</b><span>Avg wait</span></div><div><b>${R.sat}%</b><span>Staff sat</span></div></div>
<h4>Where your points came from</h4><table class="ledger">${rows || t('Nothing yet', '0')}</table>
<h4>Patients</h4><table>${t('Arrived this shift', R.seen)}${t('Discharged home', R.dc)}${t('Sent home from triage', R.pitDc)}${t('Admitted upstairs', R.adm)}${t('To the OR or cath lab', R.proc)}${t('Transferred out', R.tx)}${t('Left without being seen', R.lwbs)}${t('Left against medical advice', R.ama)}${t('72-hour returns', R.returns)}${t('Still in the ED at 19:00', R.left)}</table>
<h4>EMS and the Box</h4><table>${t('Average EMS wall time (arrival to hand-off)', R.wallAvg + 'm')}${t('EMS handed off to the waiting room', R.offloads)}${t('Units on the wall over 30 min', R.wallOver)}${t('Consults answered', `${R.boxC.ans} of ${R.boxC.ans + R.boxC.miss}`)}${t('Medical direction calls right', `${R.boxC.right} of ${R.boxC.ans}`)}${t('Alert reports taken', `${R.boxN.ans} of ${R.boxN.ans + R.boxN.miss}`)}${t('Alert time goals met', `${R.goalsMet} of ${R.goalsMet + R.goalsMiss}`)}${t('Ambulances diverted', `${R.diverted} (${R.yellowMins}m yellow, ${R.redMins}m red)`)}</table>
<h4>Services</h4><table>${t('Interpreters requested', `${R.interp} for ${R.lep} patients who needed one`)}${t('Massive transfusions', `${R.mtp}${R.mtpWaste ? ` (${R.mtpWaste} not needed)` : ''}`)}${t('Patients who went into shock', R.shock)}${t('O-negative units used', R.oneg)}${t('Meds pulled on override', `${R.overrides} (${R.medErrors} errors)`)}${t('Seen by a provider in triage', R.pitSeen)}${t('Registered / triaged', `${R.registered} / ${R.triaged}`)}${t('Sent upstairs by transporter / tech', `${R.transports.tp} / ${R.transports.pct}`)}${t('Interfacility ambulances', `${R.ift.als} ALS · ${R.ift.cct} CCT · ${R.ift.air} air${R.iftRefused ? ` (${R.iftRefused} wrong level)` : ''}`)}</table>
<h4>Team</h4><table>${t('Angry consultants', R.angry + R.wrongSpec)}${t('Nurse-minutes over ratio', R.ratioMin)}${t('Safety events', R.adverse)}${t('Agency nurses / mandates', `${R.agency} / ${R.mandates}`)}</table>
<div class="rep-btns"><button type="button" class="big act" data-act="restart">Run it back</button><button type="button" class="big" data-act="menu">Menu</button></div></div>`;
}
function showReport() {
  const G = g(), R = G.report; if (!R) return;
  U.scene = 'report'; U.sheet = null; U.modal = null; U.sel = null;
  clearToasts();
  store('oc-save', null);
  if (!R.fail && R.care > bestOf(R.level)) store('oc-best-' + R.level, String(R.care));
  const el = $('#report'); el.hidden = false; setH(el, reportHTML(R));
  render();
}

/* ---------- loop ---------- */
let last = 0, lastR = 0, demoAcc = 0;
function frame(now) {
  const dt = Math.min(0.25, Math.max(0, (now - (last || now)) / 1000)); last = now;
  const G = g();
  if (G && U.scene === 'game' && !isPaused() && !G.over) {
    let left = dt * U.speed * BASE;
    while (left > 1e-6) { const s = Math.min(0.1, left); E.step(s); left -= s; if (G.card || G.over) break; }
    save(false);
  } else if (G && U.scene === 'title') {
    demoAcc += dt;
    if (demoAcc > 0.5) { demoAcc = 0; for (let i = 0; i < 2; i++) E.step(0.25); E.botStep({}); }
  }
  if (G && U.scene === 'game' && G.over) showReport();
  if (now - lastR > 110) { lastR = now; render(); }
  requestAnimationFrame(frame);
}
function bind() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    ensureAudio();
    const fn = ACT[el.dataset.act];
    if (fn) { fn(el.dataset.arg, el); render(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (U.sel) U.sel = null; else if (U.sheet) U.sheet = null; render(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && U.scene === 'game') { U.paused = true; save(true); render(); } });
  window.addEventListener('pagehide', () => save(true));
}
function boot(data) {
  data = data || {};
  if (store('oc-sound') === '0' || data.sound === false) U.sound = false;
  const pk = store('oc-pack'); if (pk && E.PACKS[pk]) U.pack = pk;
  buildBoard(); bind();
  for (const [id, txt] of [['laneEms', 'No ambulances waiting'], ['laneWait', 'Waiting room is empty']]) $('#' + id).dataset.empty = txt;
  if (data.G && data.G.v === 3 && data.G.running && !data.G.over) {
    E.load(data.G); U.scene = 'game'; U.lvl = data.lvl || data.G.level; U.speed = data.speed || 1; U.paused = true;
    $('#title').hidden = true;
    render();
  } else showTitle();
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => (U.scene === 'game' && g() && !g().over ? { G: g(), lvl: U.lvl, speed: U.speed, sound: U.sound } : { sound: U.sound })); } catch (e) { /* ignore */ }
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data ? hot.data : {});
window.OCUI = { U, render, start, showTitle };
})();

</script>
</body>
</html>

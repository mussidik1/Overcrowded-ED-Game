# Runs on every push to main and the 3d branch: the rule checks (and that the committed build matches the source), stress, and the UI tests in Chrome. The phone-size UI tests in WebKit (the engine behind Safari) run
# only for main and by hand: since the repo went private (Nov 18), macOS minutes count ten times against the plan's monthly minutes.
# The UI tests were written against Chrome; this is the only place they run in Safari's engine.
# Each run's output is saved as webkit.txt on the ci-results branch, so it can be read without opening Actions.
name: Tests (rules + Safari engine)

on:
  push:
    branches: [main, 3d]
  workflow_dispatch:

permissions:
  contents: read   # every job reads; only the WebKit job, which saves its results file, gets write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Rule checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: The committed build matches the source
        run: git diff --exit-code --stat index.html sw.js 3d/map3d.js || { echo "Rebuild with npm run build and commit index.html, sw.js and 3d/map3d.js"; exit 1; }
      - run: npm test
      - run: npm run stress

  database:
    name: Database rules (local Postgres 17, as live)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The live project runs PostgreSQL 17 (en_US.UTF-8). PGDG's apt repository has it for this Ubuntu.
      - name: PostgreSQL 17 with pgcrypto
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -q postgresql-17 >/dev/null
          sudo locale-gen en_US.UTF-8 >/dev/null
      # The baseline and supabase/migrations on a throwaway local database, then supabase/tests/privacy_test.sql. Nothing reaches the live project.
      - run: bash supabase/tests/run.sh
        env:
          PG_BIN: /usr/lib/postgresql/17/bin

  chrome:
    name: UI tests in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run the UI tests
        run: |
          fail=0
          for t in ui_test md_ui_test map_test class_test gate_test about_test events_test imaging_test offline_test; do
            echo "=== $t ==="; timeout 600 python test/$t.py || fail=1
          done
          for m in rn md; do echo "=== train_test MODE=$m ==="; MODE=$m timeout 900 python test/train_test.py || fail=1; done
          # the 3D floor, served over http by the test itself, under the page's CSP (any console error fails it)
          echo "=== map3d_test ==="; timeout 1500 python test/map3d_test.py || fail=1
          exit $fail

  webkit:
    name: UI tests in WebKit (Safari's engine)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write   # to save the results file on the ci-results branch
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: pip install playwright
      - run: python -m playwright install webkit
      - name: Run the UI tests in WebKit
        id: ui
        continue-on-error: true   # report only until map3d_test passes in WebKit (an ambulance-reversing check fails there)
        env:
          BROWSER: webkit
        run: |
          fail=0
          {
            echo "commit $GITHUB_SHA"
            echo "date   $(date -u '+%Y-%m-%d %H:%M UTC')"
            python -m playwright --version
            sw_vers | tr '\n' ' '; echo
          } > results.txt
          run() {
            echo "" >> results.txt
            echo "=== $* ===" >> results.txt
            if env "$@" > out.txt 2>&1; then echo "PASS" >> results.txt; else echo "FAIL" >> results.txt; fail=1; fi
            grep -n "^not ok\|^ERRORS\|^No errors\|^  \|Traceback\|Error\|another app\|^note:\|^report" out.txt | head -60 >> results.txt || true
            tail -4 out.txt >> results.txt
          }
          run python test/map_test.py
          run python test/ui_test.py
          run python test/md_ui_test.py
          run MODE=rn python test/train_test.py
          run MODE=md python test/train_test.py
          run MODE=rn VW=667 VH=375 python test/train_test.py
          run LESSON=heart python test/train_test.py
          run MODE=rn python test/finger_test.py
          run MODE=md python test/finger_test.py
          run python test/offline_test.py
          run python test/map3d_test.py
          run python test/imaging_test.py
          run python test/gate_test.py
          run python test/about_test.py
          run python test/events_test.py
          run python test/class_test.py
          echo "" >> results.txt
          if [ $fail = 0 ]; then echo "ALL PASS" >> results.txt; else echo "SOME FAILED" >> results.txt; fi
          cat results.txt
          exit $fail
      - name: Save the results on the ci-results branch
        if: always()
        run: |
          [ -f results.txt ] || echo "no results: the tests did not start ($GITHUB_SHA)" > results.txt
          cp results.txt "$RUNNER_TEMP/webkit.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash -u -q || true
          # two runs (main and 3d) can finish together: start again from the latest copy and retry
          for try in 1 2 3 4 5; do
            if git fetch -q origin ci-results; then git checkout -q -f -B ci-results FETCH_HEAD; else git checkout -q --orphan ci-results; git rm -rf -q . || true; fi
            cp "$RUNNER_TEMP/webkit.txt" webkit.txt
            git add webkit.txt
            git commit -q -m "WebKit results for ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" || echo "nothing new"
            if git push -q origin ci-results; then exit 0; fi
            sleep $((try * 7))
          done
          exit 1

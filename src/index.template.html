<head>

<title>Emergency Department: Code Black</title>
<meta name="description" content="Run a full emergency department for one shift, as the charge nurse or the attending. Free, in the browser, made for phones.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Emergency Department: Code Black">
<meta property="og:title" content="Emergency Department: Code Black">
<meta property="og:description" content="Run a full ED for one shift, as the charge nurse or the attending. Free, in the browser, made for phones.">
<meta property="og:url" content="https://edcodeblack.com/">
<meta property="og:image" content="https://edcodeblack.com/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Code Black: a 3D emergency department seen from above, with nurses, doctors, and patients in the rooms">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Emergency Department: Code Black">
<meta name="twitter:description" content="Run a full ED for one shift, as the charge nurse or the attending.">

<style>
/*FONTS*/
/*STYLE*/
</style>
</head>
<body>
<div class="ghosts" aria-hidden="true">
  <span style="top:31%;left:4%;transform:rotate(-6deg)">rm 6 → 4W ✓</span>
  <span style="top:52%;right:3%;transform:rotate(4deg)">call ortho!!</span>
  <span style="top:71%;left:10%;transform:rotate(-3deg)">EVS x4112</span>
  <span style="top:88%;right:12%;transform:rotate(-8deg)">NO hallway beds!!</span>
</div>
<div class="app">
  <div class="top" id="top">
    <header class="hud">
      <div class="hud-top">
        <div class="brand">Code Black<small>Charge RN</small></div>
        <div class="clock" id="clock" aria-label="Clock">07:00</div>
        <div class="hud-btns">
          <button type="button" class="hb" id="btnYellow" data-act="yellow" aria-label="Divert status">Divert</button>
          <button type="button" class="hb" id="btnSpeed" data-act="speed" aria-label="Game speed">1×</button>
          <button type="button" class="hb hb-msg" id="btnMsgs" data-act="msgs" aria-label="Events" hidden><svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0 -8.2 a5.6 5.6 0 0 1 5.6 5.6 v3.4 l2.2 3.2 h-15.6 l2.2 -3.2 v-3.4 a5.6 5.6 0 0 1 5.6 -5.6z" fill="currentColor"/><path d="M-2.3 5.6 a2.4 2.4 0 0 0 4.6 0z" fill="currentColor"/></svg><b id="msgN"></b></button>
          <button type="button" class="hb hb-menu" id="btnPause" data-act="pause" aria-label="Menu: pause, restart, or go to the main menu"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg></button>
        </div>
      </div>
      <div class="pills">
        <button type="button" class="pill" id="pPat" data-act="pill" data-arg="pat"><b>—</b><span data-s="Patients">Patients</span></button>
        <button type="button" class="pill" id="pClin" data-act="pill" data-arg="clin"><b>—</b><span data-s="Clinical">Clinical</span></button>
        <button type="button" class="pill" id="pAdm" data-act="pill" data-arg="adm"><b>—</b><span data-s="Admin">Admin</span></button>
        <button type="button" class="pill" id="pStaff" data-act="pill" data-arg="staff"><b>—</b><span data-s="Staff">Staff</span></button>
      </div>
      <div class="shiftbar"><i id="shiftProg"></i></div>
    </header>
    <div class="boxbar" id="boxbar"></div>
    <div class="objs" id="objs" hidden></div>
    <nav class="zbar" id="zbar" aria-label="Jump to a pod"></nav>
    <div class="selbar" id="selbar" hidden></div>
  </div>
  <div class="cols">
    <main>
      <section class="map" id="map" aria-label="Floor plan"></section>
      <section class="intake" id="intake" aria-label="Patients waiting for a bed">
        <div class="istaff" id="istaff" aria-label="Intake staff"></div>
        <div class="lane">
          <div class="lane-h"><span class="lane-t">Ambulance bay</span><span class="lane-i" id="emsInfo"></span></div>
          <div class="lane-row" id="laneEms"></div>
        </div>
        <div class="lane">
          <button type="button" class="lane-h" data-act="zone" data-arg="triage"><span class="lane-t">Waiting room</span><span class="lane-i" id="waitInfo"></span></button>
          <div class="lane-row" id="laneWait"></div>
        </div>
      </section>
      <section class="board" id="board" aria-label="Bed board"></section>
      <section class="logwrap"><h3>Radio log</h3><ol class="log" id="log"></ol></section>
    </main>
    <aside class="side" id="side" aria-label="Team"></aside>
  </div>
  <button type="button" class="needbtn" id="needBtn" data-act="needNext"></button>
  <nav class="rail-l" id="railL" aria-label="Intake staff"></nav>
  <div class="mzoom" id="mzoom" aria-label="Zoom the floor plan"><button type="button" data-act="legend" aria-label="What the icons mean">?</button><button type="button" data-act="zoom" data-arg="in" aria-label="Zoom in">+</button><button type="button" data-act="zoom" data-arg="out" aria-label="Zoom out">−</button><button type="button" id="mzFit" data-act="zoom" data-arg="fit" aria-label="Show the whole floor" hidden>⤢</button></div>
  <nav class="dock" id="dock" aria-label="Providers">
    <div class="dock-prov" id="dockProv"></div>
    <button type="button" class="dock-team" id="dockTeam" data-act="team">Team</button>
  </nav>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><button type="button" class="x sheet-x" data-act="closeSheet" aria-label="Close">✕</button><div class="sheet-body" id="sheet"></div></div></div>
<div class="modal-wrap" id="modalWrap" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="coach" id="coach" hidden aria-live="polite"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="safe" aria-hidden="true"></div>
<div class="rotate" id="rotate" role="dialog" aria-label="Turn your phone sideways"><div class="rot-c"><div class="rot-ph" aria-hidden="true"></div><h3>Turn your phone sideways</h3><p>The floor plan is wide. Hold your phone sideways to see the whole department.</p><button type="button" data-act="view" data-arg="list">Use the list board instead</button></div></div>
<div class="screen" id="title"></div>
<div class="screen" id="report" hidden></div>
<script>
/*ENGINE*/
</script>
<script>
/*UI*/
</script>
</body>
</html>
